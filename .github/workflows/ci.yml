name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Check thumbnail handler formatting
        run: cargo fmt --manifest-path src-tauri/thumbnail-handler/Cargo.toml -- --check
      - name: Lint thumbnail handler
        run: cargo clippy --manifest-path src-tauri/thumbnail-handler/Cargo.toml --all-targets -- -D warnings
      - name: Test thumbnail handler
        run: cargo test --manifest-path src-tauri/thumbnail-handler/Cargo.toml
      - name: Verify dependency license report
        shell: pwsh
        run: |
          npm run licenses
          git diff --exit-code -- docs/legal/THIRD_PARTY_LICENSES.md
      - name: Build Windows desktop application
        run: npm run tauri build -- --no-bundle
