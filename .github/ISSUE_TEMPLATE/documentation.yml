name: 文档问题
description: 报告说明错误、失效链接或缺少的使用说明
title: "[Docs] "
labels: [documentation, triage]
body:
  - type: input
    id: location
    attributes:
      label: 文档位置
      description: 请提供文件路径、章节标题或页面链接。
      placeholder: README.md / 下载与安装
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 说明当前内容为什么错误、过时或不清楚。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改
      description: 如果方便，请提供建议文字或可验证来源。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认公开内容不包含无权分享的 PDF、批注、个人信息、完整本地路径或凭证。
          required: true
